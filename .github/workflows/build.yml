name: Build Android APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        env:
          TOOLS_KEYSTORE_BASE64: ${{ secrets.TOOLS_KEYSTORE_BASE64 }}
          TOOLS_STORE_PASSWORD: ${{ secrets.TOOLS_STORE_PASSWORD }}
          TOOLS_KEY_ALIAS: ${{ secrets.TOOLS_KEY_ALIAS }}
          TOOLS_KEY_PASSWORD: ${{ secrets.TOOLS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TOOLS_KEYSTORE_BASE64:?Missing keystore secret}"
          : "${TOOLS_STORE_PASSWORD:?Missing store password}"
          : "${TOOLS_KEY_ALIAS:?Missing key alias}"
          : "${TOOLS_KEY_PASSWORD:?Missing key password}"
          umask 077
          export TOOLS_KEYSTORE_PATH="$RUNNER_TEMP/tools-release.jks"
          trap 'rm -f "$TOOLS_KEYSTORE_PATH"' EXIT
          printf '%s' "$TOOLS_KEYSTORE_BASE64" | base64 --decode > "$TOOLS_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOOLS-1.0-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
